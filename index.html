<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Robótica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> <!-- Área principal do documento web -->

  <header>Inovação em Automação Robótica</header> <!-- Topo da página com identificação da empresa -->

  <section class="chamada"> <!-- Segmento de destaque com conteúdo multimídia -->

    <div class="chamada-texto"> <!-- Divisão com material textual promocional -->
      <h1>Desenvolvendo Competências com Robótica Pedagógica</h1> <!-- Cabeçalho principal da área -->
      <p>#conteúdos selecionados sobre automação e tecnologia</p> <!-- Texto de apoio com hashtag -->
      <p>ACOMPANHE AS ATUALIZAÇÕES REGULARES</p> <!-- Mensagem de alerta para usuários -->
    </div>

    <div> <!-- Container para elemento de mídia -->
      <figure> <!-- Agrupamento semântico para mídia e sua legenda -->
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ZPT-JP06H_M?si=vHTC2SL_9cGXLOGO" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <figcaption>Demonstração de aplicações robóticas na educação</figcaption> <!-- Descrição contextual do vídeo -->
      </figure>
    </div>

  </section> <!-- Encerramento da seção de chamada -->

  <section class="categoria"> <!-- Seção dedicada à galeria de vídeos -->
    <h2>CONTEÚDOS EXCLUSIVOS DE ROBÓTICA</h2> <!-- Título da galeria de mídias -->

    <div class="categoria-videos"> <!-- Agrupamento flexível para miniaturas -->

      <a href="https://youtu.be/JPITxZbf5H4?si=xLrc2tOJpZ-_qsGd"> <!-- Hiperlink para primeiro conteúdo -->
        <img src="https://img.youtube.com/vi/admjB15l00g/maxresdefault.jpg"/> <!-- Imagem representativa -->
      </a>

      <a href="https://www.youtube.com/watch?v=nCmIwcycUJ8"> <!-- Link para segundo vídeo -->
        <img src="https://img.youtube.com/vi/nCmIwcycUJ8/maxresdefault.jpg"/> <!-- Miniatura YouTube -->
      </a>

      <a href="https://www.youtube.com/watch?v=FvRmEapoHRc"> <!-- Link para terceiro vídeo -->
        <img src="https://img.youtube.com/vi/FvRmEapoHRc/maxresdefault.jpg"/> <!-- Imagem de preview -->
      </a>

      <a href="https://www.youtube.com/watch?v=Ipkw_hWW-Hw"> <!-- Link para quarto conteúdo -->
        <img src="https://img.youtube.com/vi/Ipkw_hWW-Hw/maxresdefault.jpg"/> <!-- Miniatura embedada -->
      </a>

      <a href="https://www.youtube.com/watch?v=d4DzMNGoyis"> <!-- Link para quinto vídeo -->
        <img src="https://img.youtube.com/vi/d4DzMNGoyis/maxresdefault.jpg"/> <!-- Imagem de capa -->
      </a>

    </div> <!-- Fechamento do container de vídeos -->
  </section> <!-- Término da seção de categorias -->

</body> <!-- Final do corpo do documento -->
</html> <!-- Encerramento do código HTML -->
